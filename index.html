<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Minecraft: Mine Clicker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pirata+One&display=swap">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#2b2018;background-blend-mode:multiply;color:#fff;font:11px/1.5 'Press Start 2P','Courier New',monospace;image-rendering:pixelated}
#app{position:relative;height:100%;max-width:760px;margin:0 auto;background:rgba(0,0,0,.35)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:12px;gap:4px}
.screen.active{display:flex}
.logo{margin:0 0 28px;text-align:center;font-size:clamp(22px,7vw,44px);line-height:1.2;color:#c9c9c9;text-shadow:3px 3px #333,6px 6px #1a1a1a;letter-spacing:2px}
.logo span{display:block;margin-top:14px;font-size:.5em;color:#ffd33d;text-shadow:3px 3px #5a4300;animation:splash 1.2s ease-in-out infinite alternate}
@keyframes splash{to{transform:scale(1.12) rotate(-2deg)}}
.btn{display:block;width:min(86vw,360px);margin:6px auto;padding:14px 8px;background:#8b8b8b;color:#fff;border:3px solid;border-color:#dcdcdc #373737 #373737 #dcdcdc;outline:3px solid #000;text-shadow:2px 2px #3f3f3f;font:inherit;font-size:12px;cursor:pointer;text-align:center}
.btn:hover,.btn:focus-visible{background:#7480c8}
.btn:active{border-color:#373737 #dcdcdc #dcdcdc #373737}
.mini{width:auto;min-width:44px;margin:0;padding:8px 10px}
.panel{background:#c6c6c6;border:4px solid;border-color:#fff #555 #555 #fff;outline:3px solid #000;color:#373737;padding:12px;width:min(92vw,520px);max-height:76vh;overflow:auto}
.panel h2{margin:0 0 10px;font-size:13px;color:#373737}
.row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.ach{padding:6px 0;border-bottom:2px solid #9a9a9a;font-size:9px}
.ach.on{color:#0a6b1d}.ach.off{color:#777}
#game{justify-content:flex-start;align-items:stretch;padding:8px;gap:6px}
.hud{background:rgba(0,0,0,.55);border:3px solid #000;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:10px}
.hud .row{gap:6px}
.bar{position:relative;flex:1;height:18px;background:#1c1c1c;border:3px solid #000;overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .12s}
.bar span{position:absolute;inset:0;text-align:center;font-size:8px;line-height:12px;text-shadow:1px 1px #000}
.dur i{background:#43c04a}.lay i{background:#5a9bff}.hp i{background:#e03c3c}.boss i{background:#ff8a00}
#stage{background-size:64px;background-color:#999;background-blend-mode:multiply;border:3px solid #000;position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
#vMine,#vInv{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%}
[hidden]{display:none!important}
#wrap{position:relative;display:inline-block}
#blk{width:min(62vw,38vh,300px);aspect-ratio:1;image-rendering:pixelated;display:block;cursor:pointer;touch-action:manipulation;border:4px solid #000}
#ws{position:absolute;width:30px;height:30px;transform:translate(-50%,-50%);pointer-events:none;color:#ffd33d;font-size:24px;text-align:center;line-height:30px;text-shadow:0 0 6px #ff8a00,2px 2px #000;animation:pulse .7s infinite alternate}
@keyframes pulse{to{transform:translate(-50%,-50%) scale(1.35);opacity:.65}}
#hpbarW{width:min(80vw,340px)}
#bossBar{width:min(80vw,340px);text-align:center;color:#ff8a00;font-size:10px}
#fx{position:absolute;inset:0;pointer-events:none}
.pop{position:absolute;pointer-events:none;color:#fff;text-shadow:2px 2px #000;animation:up .7s forwards;font-size:11px;z-index:3}
.pop.c{color:#ffd33d;font-size:16px}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.tabs{display:flex;gap:6px}.tabs .btn{flex:1;width:auto;margin:0;padding:12px 2px;font-size:clamp(8px,2.3vw,10px)}.tabs .btn.on{background:#5b8a3c}
.grid{display:grid;grid-template-columns:repeat(4,64px);gap:6px;justify-content:center}
.slot{position:relative;width:64px;height:64px;background:#8b8b8b;border:3px solid;border-color:#373737 #fff #fff #373737;display:flex;align-items:center;justify-content:center;font-size:26px}
.slot canvas{width:44px;height:44px;image-rendering:pixelated}
.slot b{position:absolute;right:3px;bottom:1px;font-size:10px;text-shadow:2px 2px #000}
.stats{font-size:9px;line-height:2;text-align:center;background:rgba(0,0,0,.5);padding:8px;border:3px solid #000;width:min(90vw,420px)}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:10;padding:12px;overflow:auto}
.ov.show{display:flex}
.ov h2{text-align:center;font-size:14px;margin:0 0 10px;text-shadow:2px 2px #000}
.cards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.card{width:min(88vw,200px);background:#c6c6c6;border:4px solid;border-color:#fff #555 #555 #fff;outline:3px solid #000;color:#373737;padding:10px;font:inherit;font-size:9px;line-height:1.6;cursor:pointer;text-align:center}
.card:hover,.card:focus-visible{background:#d8e6ff}
.card .ic{font-size:30px;display:block;margin-bottom:6px}.card b{display:block;font-size:11px;margin-bottom:6px}
#toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(0,0,0,.85);border:3px solid #ffd33d;padding:8px 12px;font-size:10px;z-index:20;display:none;max-width:92%;text-align:center}
.btn:disabled{opacity:.5;cursor:default;background:#6b6b6b}
#sc{width:min(90vw,420px);padding:26px 22px;text-align:center;color:#3a2410;background:radial-gradient(#e4cb94,#c9a468 80%,#9c763f);border-top:14px solid #5a3a1a;border-bottom:14px solid #5a3a1a;font-family:'Pirata One','Times New Roman',serif;border-radius:6px}
#sc h3{margin:0 0 10px;font-size:30px;letter-spacing:2px}#sc p{font-size:23px;line-height:1.3;margin:0 0 10px}#sc small{display:block;font-size:19px;margin-bottom:14px;color:#6a1010}
#sc .btn{font-family:'Press Start 2P',monospace}
#stage.bossfx{box-shadow:inset 0 0 60px rgba(160,0,0,.6)}
.adbox{height:120px;background:linear-gradient(135deg,#ff5f6d,#ffc371);display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:12px;margin:8px 0;border:3px solid #000;text-shadow:2px 2px #000;padding:8px}
#pick{position:absolute;left:52%;top:-14%;width:50%;image-rendering:pixelated;pointer-events:none;transform-origin:6% 62%;z-index:2;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.5))}
.torch{position:absolute;top:24%;width:8px;height:34px;background:#6b4a2a;border:2px solid #000;display:none}
.torch::before{content:'';position:absolute;left:-4px;top:-14px;width:12px;height:14px;background:#ffb02e;border:2px solid #7a3c00;animation:flick .25s infinite alternate}
@keyframes flick{to{transform:scale(1.2,.85);background:#ffd33d}}
#stage[data-biome="0"] .torch,#stage[data-biome="1"] .torch{display:block}
#stal{position:absolute;left:0;right:0;top:0;height:26px;display:none;pointer-events:none;background:linear-gradient(135deg,#4a4a4a 25%,transparent 25%) -13px 0/26px 26px,linear-gradient(225deg,#4a4a4a 25%,transparent 25%) -13px 0/26px 26px}
#stage[data-biome="1"] #stal{display:block}
#lavaG{position:absolute;left:0;right:0;bottom:0;height:24%;display:none;pointer-events:none;background:linear-gradient(transparent,rgba(255,110,0,.6));animation:glow 1.4s infinite alternate}
@keyframes glow{to{opacity:.5}}
#stage[data-biome="2"] #lavaG{display:block}
@media (max-width:420px){body{font-size:10px}.grid{grid-template-columns:repeat(4,56px)}.slot{width:56px;height:56px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
body{touch-action:manipulation}
#lang{position:absolute;top:6px;right:6px;z-index:30;font-size:9px;padding:6px 8px}
#app:has(#game.active) #lang{display:none}
#game .hud .row:first-child{flex-wrap:wrap;font-size:9px}
#hpbarW.bh .bar{height:26px;border-color:#600}#hpbarW.bh .hp i{background:linear-gradient(#ff7b7b,#a80000)}
#vEnch{width:min(92vw,520px)}
</style>
</head>
<body>
<div id="app">
  <button class="btn mini lg" id="lang">🌐 RU</button>
  <section id="menu" class="screen active">
    <h1 class="logo">MINECRAFT<span>Mine Clicker</span></h1>
    <button class="btn" id="bPlay">Играть</button>
    <button class="btn" id="bNew" hidden>Новая игра</button>
    <button class="btn" id="bShop">Магазин</button>
    <button class="btn" id="bEnch">Зачарование</button>
    <button class="btn" id="bScores">Рекорды / Достижения</button>
    <button class="btn" id="bSet">Настройки</button>
  </section>

  <section id="scores" class="screen">
    <div class="panel"><h2>Рекорды</h2><div id="recs"></div><h2 style="margin-top:14px">Достижения</h2><div id="achs"></div></div>
    <button class="btn back">Назад</button>
  </section>

  <section id="shopS" class="screen">
    <div class="panel" id="shopP"></div>
    <button class="btn back">Назад</button>
  </section>

  <section id="enchS" class="screen">
    <div class="panel" id="enchP"></div>
    <button class="btn back">Назад</button>
  </section>

  <section id="settings" class="screen">
    <div class="panel"><h2>Настройки</h2></div>
    <button class="btn" id="bSnd">Звук: вкл</button>
    <button class="btn" id="bMus">Музыка: вкл</button>
    <button class="btn" id="bReset">Сбросить прогресс</button>
    <button class="btn back">Назад</button>
  </section>

  <section id="game" class="screen">
    <div class="hud">
      <div class="row"><span id="hB">Блоки: 0</span><span id="hD">Глубина: 0 м</span><span id="hM">Руда: 0</span><button class="btn mini lg" id="langG">🌐 RU</button><button class="btn mini" id="bPause" aria-label="Пауза">II</button></div>
      <div class="row"><span id="hP" style="width:42%">Кирка</span><div class="bar dur"><i id="durF"></i><span id="durT"></span></div></div>
      <div class="row"><span style="width:42%">Слой <b id="hL">1</b></span><div class="bar lay"><i id="layF"></i><span id="layT"></span></div></div>
      <div id="buffs" style="min-height:14px;font-size:9px;color:#ffd33d"></div>
    </div>
    <div id="stage">
      <div class="torch" style="left:7%"></div><div class="torch" style="right:7%"></div><div id="stal"></div><div id="lavaG"></div>
      <div id="vMine">
        <div id="bossBar" hidden><div id="bossN"></div><div class="bar boss"><i id="bossF"></i><span id="bossT"></span></div></div>
        <div id="wrap"><canvas id="blk"></canvas><div id="ws">✦</div><canvas id="pick" width="16" height="16"></canvas></div>
        <div id="hpbarW"><div class="bar hp"><i id="hpF"></i><span id="hpT"></span></div></div>
        <div class="row" style="gap:6px"><button class="btn mini" id="cT" aria-label="Динамит">💣 0</button><button class="btn mini" id="cP" aria-label="Зелье спешки">🧪 0</button><button class="btn mini" id="fA">🍎 0</button><button class="btn mini" id="fS">🥩 0</button><button class="btn mini" id="fC">🥕 0</button></div>
      </div>
      <div id="vShop" class="panel" hidden></div>
      <div id="vEnch" class="panel" hidden></div>
      <div id="vInv" hidden><div class="grid" id="grid"></div><div class="stats" id="stats"></div><button class="btn" id="bSellAll">💰 Продать всё</button></div>
      <canvas id="fx"></canvas>
    </div>
    <div class="hud" style="flex-direction:row;justify-content:space-between;font-size:13px;letter-spacing:1px"><div id="hearts"></div><div id="hunger"></div></div>
    <div class="tabs"><button class="btn on" id="tM">Шахта</button><button class="btn" id="tI">Рюкзак</button><button class="btn" id="tS">Магазин</button><button class="btn" id="tE">Чары</button></div>
  </section>

  <div class="ov" id="pause">
    <h2>Пауза</h2>
    <button class="btn" id="pResume">Продолжить</button>
    <button class="btn" id="pSnd">Звук/Музыка: вкл</button>
    <button class="btn" id="pMenu">В главное меню</button>
    <button class="btn" id="pRestart">Сдаться (рестарт)</button>
  </div>

  <div class="ov" id="up">
    <h2 id="upT">Слой пройден!</h2>
    <div class="bar lay" style="flex:none;width:min(80vw,320px)"><i id="upF" style="background:#ffb02e"></i><span id="upTm"></span></div>
    <div class="cards" id="cards"></div>
    <button class="btn" id="bRand">🎲 Случайный выбор (Рандом)</button>
  </div>
  <div class="ov" id="scroll"><div id="sc"><h3>Предупреждение</h3><p>В пещере появился опасный противник, будьте готовы при встрече с ним!</p><small id="scN"></small><button class="btn" id="scGo">К бою!</button></div></div>
  <div class="ov" id="ad"><div class="panel"><h2>📺 Реклама</h2><div class="adbox">Супер-кирка 3000! (это учебная реклама)</div><div class="bar lay" style="width:100%;flex:none"><i id="adF" style="background:#ffb02e"></i><span id="adT"></span></div><button class="btn" id="adGo" disabled style="margin-top:10px">Загрузка...</button></div></div>
  <div id="toast"></div>
</div>

<script>
'use strict';
/* ============ Утилиты ============ */
const $ = s => document.querySelector(s);
const mul = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rnd = (a, b) => a + Math.random() * (b - a);
const num = n => n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : String(Math.round(n * 10) / 10);

/* ============ Данные ============ */
const ST = ['#7d7d7d', '#8a8a8a', '#6e6e6e', '#767676'];
const BL = {
  stone:    { n: 'Камень', r: 'Булыжник', c: ST, h: 1, min: 0, w: 10 },
  coal:     { n: 'Угольная руда', r: 'Уголь', c: ST, o: '#1c1c1c', h: 1.4, min: 1, w: 6 },
  iron:     { n: 'Железная руда', r: 'Железо', c: ST, o: '#d8af93', h: 2, min: 2, w: 5 },
  gold:     { n: 'Золотая руда', r: 'Золото', c: ST, o: '#fcee4b', h: 2.6, min: 3, w: 4 },
  diamond:  { n: 'Алмазная руда', r: 'Алмазы', c: ST, o: '#5decf5', h: 4, min: 4, w: 3 },
  obsidian: { n: 'Обсидиан', r: 'Обсидиан', c: ['#14091f', '#1e0f33', '#0c0614', '#2a1647'], o: '#6a3fb0', h: 7, min: 5, w: 3 },
  redstone: { n: 'Редстоун', r: 'Редстоун', c: ST, o: '#e01919', h: 1, w: 0 },
  emerald:  { n: 'Изумруд', r: 'Изумруд', c: ST, o: '#18d65a', h: 1, w: 0 },
  netherstar: { n: 'Звезда Незера', r: 'Звезда Незера', c: ['#c8c8c8', '#f0f0f0', '#b0b0b0', '#e2e2e2'], o: '#ffe94d', h: 1, w: 0 },
  creeper:  { n: 'Крипер-гигант', c: ['#4fa83d', '#5dbb48', '#3f8e30', '#52b03f'], o: '#0b1f08', h: 1, w: 0, boss: 1 },
  lava:     { n: 'Лавовый монолит', c: ['#3b0d0d', '#5a1a0a', '#2a0808', '#4a1010'], o: '#ff7a00', h: 1, w: 0, boss: 1 },
  guardian: { n: 'Древний страж', c: ['#2a7a72', '#3a9a8e', '#1f5f5a', '#338a80'], o: '#f4d98b', h: 1, w: 0, boss: 1 }
};
const ITEMS = ['stone', 'coal', 'iron', 'gold', 'diamond', 'obsidian', 'redstone', 'emerald', 'netherstar'];
const PK = [['Деревянная', 1], ['Каменная', 2.2], ['Железная', 4.5], ['Алмазная', 9], ['Незеритовая', 18]];

const UP = [
  { t: 'Новая кирка', i: '⛏️', w: 3, ok: () => S.pick < 4, d: () => PK[S.pick + 1][0] + ' кирка: урон ×' + (PK[S.pick + 1][1] / PK[S.pick][1]).toFixed(1) + ', полный ремонт, прочность +20', go: () => { S.pick++; S.maxDur += 20; S.dur = S.maxDur; } },
  { t: 'Эффективность', i: '✨', w: 3, ok: () => S.eff < 5, d: () => 'Ур. ' + (S.eff + 1) + ': 10% шанс двойного урона и 2% шанс сломать блок с одного удара', go: () => S.eff++ },
  { t: 'Прочность', i: '🛡️', w: 2, ok: () => S.unb < 5, d: () => 'Ур. ' + (S.unb + 1) + ': износ кирки при ударе ещё на 30% ниже', go: () => S.unb++ },
  { t: 'Починка', i: '🔧', w: 2, ok: () => S.mend < 4, d: () => 'Ур. ' + (S.mend + 1) + ': +25 прочности за каждый пройденный слой', go: () => S.mend++ },
  { t: 'Житель-шахтёр', i: '🧑‍🌾', w: 3, ok: () => S.auto < 10, d: () => 'Ещё один работник: +2.5 урона в секунду автоматически', go: () => S.auto++ },
  { t: 'Кладоискатель', i: '🍀', w: 2, ok: () => S.fort < 5, d: () => 'Ур. ' + (S.fort + 1) + ': 8% шанс найти редстоун или изумруд, они дают бафф на 10 с', go: () => S.fort++ },
  { t: 'Наковальня', i: '⚒️', w: 1, ok: () => S.dur < S.maxDur * .7, d: () => 'Полностью чинит кирку', go: () => { S.dur = S.maxDur; } }
];

const AC = [
  ['first', 'Первый блок', 'Добыть 1 блок', s => s.mined >= 1],
  ['m50', 'Шахтёр', 'Добыть 50 блоков', s => s.mined >= 50],
  ['m150', 'Глубокая шахта', 'Добыть 150 блоков', s => s.mined >= 150],
  ['dia', 'Алмазы!', 'Добыть алмазную руду', s => s.inv.diamond > 0],
  ['obs', 'Тёмный камень', 'Добыть обсидиан', s => s.inv.obsidian > 0],
  ['crit', 'Меткий глаз', '25 критических ударов за забег', s => s.crits >= 25],
  ['em', 'Счастливчик', 'Найти изумруд', s => s.inv.emerald > 0],
  ['net', 'Незерит', 'Получить незеритовую кирку', s => s.pick >= 4],
  ['boss', 'Победитель боссов', 'Победить босса', s => s.bosses >= 1]
];

/* ============ Хранилище ============ */
const Store = {
  d: { best: { mined: 0, depth: 0, bosses: 0, runs: 0 }, ach: {}, snd: 1, mus: 1, coins: 0, shop: {}, cons: {}, armor: 0, food: {}, ench: {}, lang: 'ru' },
  load() { try { const j = JSON.parse(localStorage.getItem('mmc1')); if (j) Object.assign(this.d, j); } catch (e) {} },
  save() { try { localStorage.setItem('mmc1', JSON.stringify(this.d)); } catch (e) {} }
};

/* ============ Звук ============ */
const Snd = {
  ctx: null,
  start() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, d, type, v, to, mus) {
    if (!this.ctx || !(mus ? Store.d.mus : Store.d.snd)) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain(), t = this.ctx.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + d);
  },
  hit(c, k, p) {
    const hard = { stone: 1100, coal: 1300, iron: 1700, gold: 1900, diamond: 2400, obsidian: 800, redstone: 1400, emerald: 2200, lava: 600, guardian: 700, netherstar: 2000 }[k] || 1200;
    const base = [110, 160, 230, 330, 85][p] || 120;
    this.noise(.09, hard * rnd(.9, 1.1), .35);
    this.tone(base * rnd(.95, 1.08), .08, p >= 2 ? 'triangle' : 'square', .045, base * .5);
    if (c) this.tone(880, .15, 'triangle', .08, 1500);
  },
  noise(d, f, v) {
    if (!this.ctx || !Store.d.snd) return;

$('#bScores').onclick = () => { scoresRender(); go('scores'); };
$('#bSet').onclick = () => { syncBtns(); go('settings'); };
document.querySelectorAll('.back').forEach(b => b.onclick = () => go('menu'));
$('#bSnd').onclick = () => { Store.d.snd ^= 1; Store.save(); syncBtns(); };
$('#bMus').onclick = () => { Store.d.mus ^= 1; Store.save(); syncBtns(); };
let rst = 0;
$('#bReset').onclick = () => {
  if (!rst) { rst = 1; $('#bReset').textContent = 'Точно? Нажми ещё раз'; setTimeout(() => { rst = 0; $('#bReset').textContent = 'Сбросить прогресс'; }, 3000); return; }
  rst = 0; $('#bReset').textContent = 'Сбросить прогресс';
  try { localStorage.removeItem('mmc_run'); } catch (e) {}
  Object.assign(Store.d, { best: { mined: 0, depth: 0, bosses: 0, runs: 0 }, ach: {}, coins: 0, shop: {}, cons: {}, armor: 0, food: {}, ench: {} });
  S = null; Store.save(); syncBtns(); toast('Прогресс сброшен');
};
$('#bPause').onclick = () => pause(true);
$('#pResume').onclick = () => pause(false);
$('#pSnd').onclick = () => { const v = (Store.d.snd || Store.d.mus) ? 0 : 1; Store.d.snd = Store.d.mus = v; Store.save(); syncBtns(); };
$('#pMenu').onclick = () => { save(); saveRun(); S = null; $('#pause').classList.remove('show'); syncBtns(); go('menu'); };
$('#pRestart').onclick = () => { endRun(); start(); };
$('#tM').onclick = () => setView(0);
$('#tI').onclick = () => setView(1);
$('#tS').onclick = () => setView(2);
$('#bShop').onclick = () => { shopRender($('#shopP')); go('shopS'); };

$('#vShop').onclick = shopClick;
$('#cT').onclick = () => {
  if (!S || S.paused || S.view || !Store.d.cons.tnt) return;
  Store.d.cons.tnt--; Store.save(); shake(); Snd.brk();
  damage(S.blk.boss ? S.blk.max * .25 : S.blk.hp);
};
$('#cP').onclick = () => {
  if (!S || S.paused || S.view || !Store.d.cons.potion) return;
  Store.d.cons.potion--; Store.save(); S.buffs.haste = Math.max(S.buffs.haste, 20); toast('Спешка на 20 с'); hud();
};
blk.addEventListener('pointerdown', e => { e.preventDefault(); click(e); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { pause(true); saveRun(); } });
addEventListener('pagehide', () => { if (S) { save(); saveRun(); } Store.save(); });

/* ============ Выживание, сохранение, боссы ============ */
const AR = [['Кожаная', 60, 10], ['Кольчужная', 200, 22], ['Железная', 500, 36], ['Алмазная', 1100, 50], ['Незеритовая', 2400, 65]];
const FD = [
  { id: 'apple', n: 'Яблоко', d: '+25 сытости', cost: 10, f: 25, h: 0, b: 'fA', e: '🍎' },
  { id: 'steak', n: 'Стейк', d: '+60 сытости', cost: 30, f: 60, h: 0, b: 'fS', e: '🥩' },
  { id: 'carrot', n: 'Золотая морковь', d: '+100 сытости, +4 сердца', cost: 75, f: 100, h: 4, b: 'fC', e: '🥕' }
];
let hk = '';
const GAPS = [15, 15, 20, 25, 35];
function gapFor(n) { return n < 5 ? GAPS[n] : 35 + 10 * (n - 4); }
const RI = { stone: '🪨', coal: '⚫', iron: '🔩', gold: '🪙', diamond: '💎', obsidian: '🟣', redstone: '🔴', emerald: '🟢', netherstar: '⭐' };
const IC = { dmg: '⛏️', dur: '🛠️', auto: '🧑‍🌾', coin: '🤝' }, CI = { tnt: '💣', potion: '🧪' }, AI = ['🧥', '⛓️', '🛡️', '💎', '🔥'];
function adRepair() {
  if (!S) return;
  const ov = $('#ad'), go = $('#adGo'); let t = 4;
  S.paused = true; ov.classList.add('show'); go.disabled = true; go.textContent = 'Загрузка рекламы...'; $('#adF').style.width = '0%';
  const iv = setInterval(() => {
    t -= .1; $('#adF').style.width = (100 - t * 25) + '%'; $('#adT').textContent = Math.max(0, Math.ceil(t)) + ' с';
    if (t <= 0) { clearInterval(iv); go.disabled = false; go.textContent = 'Получить награду'; }
  }, 100);
  go.onclick = () => { ov.classList.remove('show'); if (S) { S.paused = false; S.dur = Math.min(S.maxDur, S.dur + S.maxDur * .5); toast('Кирка починена на 50%'); hud(); } };
}
function loadRun() {
  try { const j = JSON.parse(localStorage.getItem('mmc_run')); if (j && j.blk) { const s = Object.assign(fresh(), j); s.paused = false; s.view = 0; s.up = 0; delete s.biome; delete s.pk; return s; } } catch (e) {}
  return null;
}
function saveRun() { if (S && !S.up) try { localStorage.setItem('mmc_run', JSON.stringify(S)); } catch (e) {} }
function hurt(h) {
  const r = Store.d.armor ? AR[Store.d.armor - 1][2] / 100 : 0;
  h = Math.max(.5, Math.round(h * (1 - r) * 2) / 2); S.hp -= h;
  stage.animate([{ boxShadow: 'inset 0 0 90px 20px rgba(255,0,0,.9)' }, { boxShadow: 'inset 0 0 0 0 rgba(255,0,0,0)' }], { duration: 450 });
  stage.animate([{ transform: 'translateX(-6px)' }, { transform: 'translateX(6px)' }, { transform: 'none' }], { duration: 200 });
  Snd.tone(90, .25, 'sawtooth', .08, 50); toast('Босс бьёт: −' + h + ' ❤');
  if (S.hp <= 0) defeat();
}
function defeat() {
  const b = S.blk && S.blk.boss;
  ITEMS.forEach(k => S.inv[k] = (S.inv[k] || 0) >> 1);
  S.mined -= S.layerM; S.layerM = 0; S.hp = 10; S.food = Math.max(S.food, 40);
  if (b) S.nextBoss = S.mined + 20;
  toast('Поражение! Откат на чекпоинт, ресурсы −50%'); Snd.tone(70, .5, 'sawtooth', .1, 30); newBlock();
}
function showScroll() {
  S.paused = true;
  const t = Math.min(S.bosses, 4), sc = $('#sc');
  $('#scN').textContent = BL[S.blk.k].n + ' · Опасность: ' + '☠'.repeat(t + 1);
  sc.style.filter = 'brightness(' + (1 - .15 * t) + ') saturate(' + (1 + .25 * t) + ')';
  sc.style.boxShadow = '0 0 ' + (20 + t * 14) + 'px rgba(150,0,0,' + (.35 + .12 * t) + ')';
  $('#scroll').classList.add('show');
}
$('#scGo').onclick = () => { $('#scroll').classList.remove('show'); S.paused = false; };
FD.forEach(f => $('#' + f.b).onclick = () => {
  if (!S || S.paused || !Store.d.food[f.id]) return;
  Store.d.food[f.id]--; S.food = Math.min(100, S.food + f.f); S.hp = Math.min(10, S.hp + f.h); Store.save(); hk = ''; hud();
});

/* ============ Магазин ============ */
const PR = { stone: 1, coal: 4, iron: 8, gold: 15, diamond: 45, obsidian: 30, redstone: 10, emerald: 35, netherstar: 300 };
const SH = [
  { id: 'dmg', n: 'Закалка кирки', d: '+10% урона', base: 40, max: 10 },
  { id: 'dur', n: 'Запас прочности', d: '+20 прочности со старта забега', base: 30, max: 5 },
  { id: 'auto', n: 'Житель при старте', d: '+1 шахтёр со старта забега', base: 90, max: 3 },
  { id: 'coin', n: 'Торговец', d: '+10% к цене продажи', base: 50, max: 5 }
];
const CN = [
  { id: 'tnt', n: 'Динамит', d: 'Ломает блок сразу (боссу −25% HP)', cost: 40 },
  { id: 'potion', n: 'Зелье спешки', d: 'Спешка на 20 с', cost: 50 }
];
const price = k => Math.round(PR[k] * (1 + .1 * (Store.d.shop.coin || 0)));
const cost = i => Math.round(i.base * Math.pow(1.7, Store.d.shop[i.id] || 0));
function shopRender(el) {
  const d = Store.d, inv = S ? S.inv : {};
  let h = '<h2>🛒 Магазин: ' + d.coins + ' 💰</h2><button class="btn" data-all="1" style="width:100%;margin:0 0 8px"' + (S && sellVal() ? '' : ' disabled') + '>💰 Продать всё (+' + sellVal() + ')</button><div class="ach"><b>💰 Продажа ресурсов</b>' + (S ? '' : ' (доступна во время игры)') + '</div>';
  ITEMS.forEach(k => { const n = inv[k] || 0; h += '<div class="ach row"><span>' + RI[k] + ' ' + BL[k].r + ' ×' + n + '</span><button class="btn mini" data-s="' + k + '"' + (n ? '' : ' disabled') + '>+' + n * price(k) + '</button></div>'; });
  h += '<div class="ach"><b>⛏️ Постоянные баффы</b></div>';
  SH.forEach(i => { const l = d.shop[i.id] || 0, m = l >= i.max; h += '<div class="ach row"><span>' + IC[i.id] + ' ' + i.n + ' ' + l + '/' + i.max + '<br>' + i.d + '</span><button class="btn mini" data-b="' + i.id + '"' + (m || d.coins < cost(i) ? ' disabled' : '') + '>' + (m ? 'макс' : cost(i)) + '</button></div>'; });
  h += '<div class="ach"><b>🛡️ Броня</b> (снижает урон боссов)</div>';
  AR.forEach((a, i) => { const own = d.armor > i; h += '<div class="ach row"><span>' + AI[i] + ' ' + a[0] + ' −' + a[2] + '%</span><button class="btn mini" data-a="' + i + '"' + (own || d.armor !== i || d.coins < a[1] ? ' disabled' : '') + '>' + (own ? '✔' : a[1]) + '</button></div>'; });
  h += '<div class="ach"><b>🥩 Еда</b></div>';
  FD.forEach(f => { h += '<div class="ach row"><span>' + f.e + ' ' + f.n + ' (есть ' + (d.food[f.id] || 0) + ')<br>' + f.d + '</span><button class="btn mini" data-f="' + f.id + '"' + (d.coins < f.cost ? ' disabled' : '') + '>' + f.cost + '</button></div>'; });
  h += '<div class="ach"><b>🔧 Ремонт</b></div><div class="ach row"><span>📺 Починка за рекламу<br>+50% прочности кирки</span><button class="btn mini" data-ad="1"' + (S ? '' : ' disabled') + '>▶</button></div><div class="ach"><b>🧪 Расходники</b></div>';
  CN.forEach(i => { h += '<div class="ach row"><span>' + CI[i.id] + ' ' + i.n + ' (есть ' + (d.cons[i.id] || 0) + ')<br>' + i.d + '</span><button class="btn mini" data-c="' + i.id + '"' + (d.coins < i.cost ? ' disabled' : '') + '>' + i.cost + '</button></div>'; });
  el.innerHTML = h;
}
function shopClick(e) {
  const b = e.target.closest('button'), d = Store.d;
  if (!b || b.disabled) return;
  if (b.dataset.all) sellAll();
  else if (b.dataset.s) { const k = b.dataset.s; d.coins += (S.inv[k] || 0) * price(k); S.inv[k] = 0; }
  else if (b.dataset.b) { const i = SH.find(x => x.id === b.dataset.b); d.coins -= cost(i); d.shop[i.id] = (d.shop[i.id] || 0) + 1; }
  else if (b.dataset.ad) { adRepair(); return; }
  else if (b.dataset.a) { d.coins -= AR[+b.dataset.a][1]; d.armor++; }
  else if (b.dataset.f) { const f = FD.find(x => x.id === b.dataset.f); d.coins -= f.cost; d.food[f.id] = (d.food[f.id] || 0) + 1; }
  else { const i = CN.find(x => x.id === b.dataset.c); d.coins -= i.cost; d.cons[i.id] = (d.cons[i.id] || 0) + 1; }
  Store.save(); shopRender(e.currentTarget); if (S) hud();
}

/* ============ Продажа, зачарования, язык ============ */
const sellVal = () => S ? ITEMS.reduce((a, k) => a + (S.inv[k] || 0) * price(k), 0) : 0;
function sellAll() {
  const v = sellVal();
  if (!v) { toast('Нечего продавать'); return; }
  ITEMS.forEach(k => S.inv[k] = 0); Store.d.coins += v; Store.save();
  Snd.tone(660, .12, 'square', .06, 990); toast('Продано: +' + v + ' 💰');
}
const EC = [
  { id: 'boss', i: '⚔️', n: 'Урон по боссам', d: '+15% урона кликов по боссам за уровень', base: 60, max: 10 },
  { id: 'luck', i: '🍀', n: 'Удача', d: '+7% шанс выбить сразу несколько блоков', base: 50, max: 10 }
];
const ecost = i => Math.round(i.base * Math.pow(1.6, Store.d.ench[i.id] || 0));
function enchRender(el) {
  const d = Store.d; let h = '<h2>✨ Зачарование: ' + d.coins + ' 💰</h2>';
  EC.forEach(i => {
    const l = d.ench[i.id] || 0, m = l >= i.max;
    h += '<div class="ach row"><span>' + i.i + ' ' + i.n + ' ' + l + '/' + i.max + '<br><span style="color:#7a2fd0">' + '▰'.repeat(l) + '▱'.repeat(i.max - l) + '</span><br>' + i.d + '</span><button class="btn mini" data-e="' + i.id + '"' + (m || d.coins < ecost(i) ? ' disabled' : '') + '>' + (m ? 'макс' : ecost(i)) + '</button></div>';
  });
  el.innerHTML = h;
}
function enchClick(e) {
  const b = e.target.closest('button'), d = Store.d;
  if (!b || b.disabled) return;
  const i = EC.find(x => x.id === b.dataset.e);
  if (!i || d.coins < ecost(i) || (d.ench[i.id] || 0) >= i.max) return;
  d.coins -= ecost(i); d.ench[i.id] = (d.ench[i.id] || 0) + 1; Store.save();
  Snd.start(); Snd.tone(784, .15, 'triangle', .07, 1568);
  enchRender(e.currentTarget); if (S) hud();
}

const CY = /[А-Яа-яЁё]/, orig = new WeakMap();
const tr = s => { for (const [r, e] of PH) s = s.split(r).join(e); return s.replace(/(\d)\s?с(?![а-яё])/g, '$1 s').replace(/(\d) м(?![а-яё])/g, '$1 m'); };
const one = n => { if (CY.test(n.nodeValue)) { orig.set(n, n.nodeValue); n.nodeValue = tr(n.nodeValue); } };
function xlate(root) {
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n; n = w.nextNode();) {
    if (lang === 'en') one(n); else if (orig.has(n)) { n.nodeValue = orig.get(n); orig.delete(n); }
  }
}
new MutationObserver(ms => {
  if (lang !== 'en') return;
  ms.forEach(m => {
    if (m.type === 'characterData') one(m.target);
    else m.addedNodes.forEach(n => n.nodeType === 3 ? one(n) : n.nodeType === 1 && xlate(n));
  });
}).observe($('#app'), { childList: true, subtree: true, characterData: true });
function setLang(l) {
  lang = l; Store.d.lang = l; Store.save(); document.documentElement.lang = l;
  document.querySelectorAll('.lg').forEach(b => b.textContent = '🌐 ' + l.toUpperCase());
  xlate($('#app')); syncBtns(); scoresRender(); enchRender($('#enchP')); shopRender($('#shopP'));
  if (S) { hk = ''; render(); if (S.view === 1) invRender(); if (S.view === 2) shopRender($('#vShop')); if (S.view === 3) enchRender($('#vEnch')); }
}
document.querySelectorAll('.lg').forEach(b => b.onclick = () => setLang(lang === 'ru' ? 'en' : 'ru'));

/* ============ Запуск ============ */
(function init() {
  Store.load(); setLang(Store.d.lang === 'en' ? 'en' : 'ru');
  const c = document.createElement('canvas'), g = c.getContext('2d'), r = mul(9);
  c.width = c.height = 16;
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { g.fillStyle = ['#5a3d25', '#6b4a2e', '#4a321e', '#573a24'][r() * 4 | 0]; g.fillRect(x, y, 1, 1); }
  document.body.style.backgroundImage = 'url(' + c.toDataURL() + ')';
  document.body.style.backgroundSize = '64px 64px';
  let last = performance.now();
  setInterval(() => { const n = performance.now(); tick(Math.min(.5, (n - last) / 1000)); last = n; }, 100);
  setInterval(() => Snd.note(), 700);
  setInterval(saveRun, 5000);
  loop();
})();
</script>
